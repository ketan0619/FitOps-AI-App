name: DevSecOps End-to-End Pipeline

on:
   workflow_call: 

jobs:

       dependencies-installation:
           runs-on: ubuntu-latest

           steps:
             - name: Checkout code
               uses: actions/checkout@v4

             - name: Set up Python
               uses: actions/setup-python@v5
               with:
                  python-version: '3.11'

             - name: Install dependencies
               run: |
                   pip install -r requirements.txt -r requirements-DevSecOps.txt

       code-quality:
            uses: ./.github/workflows/code-quality.yml

       secrets-scan:
            uses: ./.github/workflows/secrets-scan.yml
            secrets: inherit

       dependency-scan:
            uses: ./.github/workflows/dependency-scan.yml

       docker-scan:
            uses: ./.github/workflows/docker-lint.yml

       build:
            needs: [code-quality, secrets-scan, dependency-scan, docker-scan]
            uses: ./.github/workflows/docker-build-and-push.yml
            secrets: inherit

       trivy:
            needs: [build]
            uses: ./.github/workflows/image-scan.yml
            secrets: inherit

       deploy:
            needs: [trivy]
            uses: ./.github/workflows/deploy.yml
            secrets: inherit
