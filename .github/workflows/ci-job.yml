name: GitOps CI - Build & Push to DockerHub

on:
  workflow_call:

permissions:
  contents: write

env:
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}

jobs:
  build-test-and-push:
    name: Build, Test & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: login to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{ vars.DOCKERHUB_USER }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ steps.tag.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
            image-ref: ${{ env.DOCKERHUB_REPO }}:${{ steps.tag.outputs.sha_short }}
            severity: 'CRITICAL,HIGH'
            exit-code: '1'

      - name: Update Kubernetes deployment manifest
        run: |
          sed -i "s|image: ${{ env.DOCKERHUB_REPO }}:.*|image: ${{ env.DOCKERHUB_REPO }}:${{ steps.tag.outputs.sha_short }}|" manifests/deployment.yml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/*
          git diff --staged --quiet || git commit -m "ci: update fitops-ai-app image to ${{ steps.tag.outputs.sha_short }} [skip ci]"
          git push


