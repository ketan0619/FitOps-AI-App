apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fitops-ai-app-workload
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ketan0619/FitOps-AI-App.git'
    targetRevision: HEAD
    path: manifests/app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: fitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
